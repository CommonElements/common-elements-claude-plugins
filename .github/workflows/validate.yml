name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code@2.1.295
      - run: claude plugin validate .
      - run: for p in plugins/*/; do claude plugin validate --strict "$p"; done
      - name: Check JSON parses
        run: for f in .claude-plugin/marketplace.json .agents/plugins/marketplace.json registry/server.json plugins/*/.mcp.json plugins/*/mcp.json plugins/*/plugin.json plugins/*/.claude-plugin/plugin.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
